<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Storage</title>
    <!-- BootStrap  CSS-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="text-bg-dark">
    <h1>Local Storage</h1>
    <p>
      The localStorage read-only property of the window interface allows you to
      access a Storage object for the Document's origin; the stored data is
      saved across browser sessions.
    </p>

    <button id="btnSet" class="btn btn-primary">Set Item</button>
    <button id="btnGet" class="btn btn-primary">Get Item</button>
    <button id="btnRemove" class="btn btn-primary">Remove Item</button>

    <script>
      btnSet.addEventListener("click", function () {
        localStorage.setItem("name", "Rohan");
        localStorage.setItem("age", "20");
        console.log("Item Added to Local Storage");

      });

      btnGet.addEventListener("click", function () {
        const data1 = localStorage.getItem("name");
        const data2 = localStorage.getItem("age");
        console.log(data1);
        console.log(data2);
      });

      btnRemove.addEventListener("click", function () {
        localStorage.removeItem("name");
        localStorage.removeItem("age");
        console.log("Item Remove From Local Storage");
      });
    </script>
  </body>
</html>
